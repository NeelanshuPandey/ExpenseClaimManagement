
server:
  port: 8080

spring:
  # Load the project-root .env when running Maven from the backend directory.
  # Docker Compose supplies these values as environment variables instead.
  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expense_claims}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:localhost}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET}
    access-ms: 900000
    refresh-ms: 604800000

  upload-dir: ${UPLOAD_DIR:./uploads}

  manager:
    email: ${MANAGER_EMAIL}
    password: ${MANAGER_PASSWORD}
