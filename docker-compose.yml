services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: expense_claims
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localhost}
    ports:
      - "5432:5432"
    volumes:
      - expense_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_claims"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/expense_claims
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-localhost}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in ExpenseClaimManagement/.env}
      MANAGER_EMAIL: ${MANAGER_EMAIL:?Set MANAGER_EMAIL in ExpenseClaimManagement/.env}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:?Set MANAGER_PASSWORD in ExpenseClaimManagement/.env}
      UPLOAD_DIR: /data/uploads
    ports:
      - "8080:8080"
    volumes:
      - expense_receipts:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  expense_pgdata:
  expense_receipts:
